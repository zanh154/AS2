  <text x="172" y="587" text-anchor="middle" font-size="9.5" fill="#64748b">Query · Command</text>
  <text x="369" y="554" text-anchor="middle" font-size="15" font-weight="600" fill="#7c3a1d">AivesDbContext</text>
