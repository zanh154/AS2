  <text x="566" y="587" text-anchor="middle" font-size="9.5" fill="#64748b">User · Course · ExamSession</text>

  <path d="M 265 627 a 105 17 0 0 1 210 0 l 0 58 a 105 17 0 0 1 -210 0 z" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
