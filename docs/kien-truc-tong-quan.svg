<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" viewBox="0 0 1440 1130" role="img" aria-labelledby="title desc"><title id="title">AIVES — ASM2 System Architecture</title><desc id="desc">Three layers: Presentation, Business and Data Access. Razor Pages and MVC, SignalR, MySQL, private file storage and Ollama.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="live" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0d9488"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#18253d}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526079}.heading{font-size:20px;font-weight:700}.label{font-size:16px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526079}.mono{font-family:Consolas,monospace;font-size:13px;fill:#526079}.line{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}.live{fill:none;stroke:#0d9488;stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#live)}</style><rect width="1440" height="1130" fill="#f8fafc"/>
