<rect x="184" y="382" width="114" height="52" rx="3" class="card"/><text x="241" y="404" class="c">Repositories</text><text x="241" y="423" class="s">13 repository</text>
<rect x="310" y="382" width="114" height="52" rx="3" class="card"/><text x="367" y="404" class="c">DbContext</text><text x="367" y="423" class="s">AivesDbContext</text>
<rect x="436" y="382" width="114" height="52" rx="3" class="card"/><text x="493" y="404" class="c">Entity models</text><text x="493" y="423" class="s">23 entity</text>

