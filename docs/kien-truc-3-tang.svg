<rect x="247" y="238" width="114" height="52" rx="3" class="card"/><text x="304" y="260" class="c">Services</text><text x="304" y="279" class="s">Auth, ExamSession…</text>
<rect x="373" y="238" width="114" height="52" rx="3" class="card"/><text x="430" y="260" class="c">Interfaces</text><text x="430" y="279" class="s">IxxxService</text>

