<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1040" viewBox="0 0 780 520" role="img" aria-labelledby="title">
<title id="title">AssignmentPRN system architecture</title>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9a9a9a" stroke-width="1.2"/></marker>
</defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#f2f2f2;text-anchor:middle}
.t{font-size:15px;font-weight:600}.h{font-size:14px;font-weight:600}.c{font-size:14px;font-weight:600}.s{font-size:11.5px;fill:#bdbdbd}
.side{font-size:13px;font-weight:700}.ln{stroke:#9a9a9a;stroke-width:1.2;fill:none;marker-end:url(#a)}.dl{stroke:#9a9a9a;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
